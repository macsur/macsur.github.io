<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw / AI 工具未来实验室</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="styles/custom.css">
    <link rel="stylesheet" href="styles/aliyun-feature.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'OpenClaw / AI 工具未来实验室',
            repo: 'https://github.com/macsur/macsur.github.io',
            loadSidebar: true,
            subMaxLevel: 2,
            themeColor: '#7dd3fc',
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索教程...',
                noData: '没有找到结果!',
                depth: 2
            },
            copyCode: {
                buttonText: '复制代码',
                errorText: '错误',
                successText: '已复制'
            },
            pagination: {
                previousText: '上一章',
                nextText: '下一章',
                crossChapter: true,
                crossChapterText: true,
            }
        }
    </script>
    <!-- Docsify v4 (cache-busted) -->
    <!-- bump DOCSIFY_ASSET_VER when sidebar/pages update but clients stick on Loading... -->
    <script>
      window.DOCSIFY_ASSET_VER = '20260314-1';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4?v=20260314-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js?v=20260314-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js?v=20260314-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js?v=20260314-1"></script>
    <script src="styles/custom.js?v=20260314-1"></script>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QRSML4TN1N"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QRSML4TN1N', {
        page_title: document.title,
        page_location: window.location.href,
        cookie_flags: 'SameSite=None;Secure'
    });
</script>

<!-- Giscus 评论系统 -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var giscusDiv = document.createElement('div');
        giscusDiv.id = 'giscus-container';
        giscusDiv.style.textAlign = 'center';
        giscusDiv.style.margin = '3em 0';

        var title = document.createElement('h3');
        title.textContent = '💬 讨论与反馈';
        title.style.color = '#4a5568';
        title.style.marginBottom = '1em';

        var desc = document.createElement('p');
        desc.innerHTML = '✨ 欢迎在评论区提问、分享想法！<br>（使用 GitHub 账号登录，基于 GitHub Discussions）';
        desc.style.color = '#718096';
        desc.style.fontSize = '0.9em';
        desc.style.marginBottom = '1.5em';

        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', 'macsur/macsur.github.io');
        script.setAttribute('data-repo-id', 'R_kgDOMVehHw');
        script.setAttribute('data-category', 'Q&A');
        script.setAttribute('data-category-id', 'DIC_kwDOMVehH84C30Cq');
        script.setAttribute('data-mapping', 'pathname');
        script.setAttribute('data-strict', '0');
        script.setAttribute('data-reactions-enabled', '1');
        script.setAttribute('data-emit-metadata', '0');
        script.setAttribute('data-input-position', 'bottom');
        script.setAttribute('data-theme', 'preferred_color_scheme');
        script.setAttribute('data-lang', 'zh-CN');
        script.setAttribute('crossorigin', 'anonymous');
        script.async = true;

        giscusDiv.appendChild(title);
        giscusDiv.appendChild(desc);
        giscusDiv.appendChild(script);
        document.body.appendChild(giscusDiv);
    });
</script>
</body>
</html>
