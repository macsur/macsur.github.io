name: Mirror to Gitee

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee-main
  cancel-in-progress: false

jobs:
  mirror:
    # Prevent running on automated bump commits to reduce noise (optional)
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore: bump DOCSIFY_ASSET_VER')
          && !startsWith(github.event.head_commit.message, 'chore: bump DOCSIFY_ASSET_VER to') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main -> Gitee (force)
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_SAFE_EMAIL: ${{ secrets.GITEE_SAFE_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_USERNAME}" ] || [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_REPO}" ]; then
            echo "Missing required secrets: GITEE_USERNAME / GITEE_TOKEN / GITEE_REPO"
            exit 1
          fi

          # Never print token
          echo "::add-mask::${GITEE_TOKEN}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rewrite author/committer emails to avoid Gitee rejecting hidden/noreply emails.
          # This will change commit hashes on Gitee (content stays identical).
          SAFE_EMAIL="${GITEE_SAFE_EMAIL:-8610708@qq.com}"
          echo "Rewriting commit emails to: ${SAFE_EMAIL}"

          git filter-branch -f --env-filter "
            export GIT_AUTHOR_EMAIL='${SAFE_EMAIL}';
            export GIT_COMMITTER_EMAIL='${SAFE_EMAIL}';
          " -- --all

          # Add gitee remote with token auth
          GITEE_URL="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"

          git remote remove gitee 2>/dev/null || true
          git remote add gitee "${GITEE_URL}"

          # Force push rewritten history
          git push --force gitee main:main
          git push --force gitee --tags
