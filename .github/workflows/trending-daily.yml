name: 每日定时更新 Github乐园 TOP10

on:
  schedule:
    # 避开全球整点拥堵高峰，错峰运行：
    # 每天北京时间早上 06:25 (UTC 22:25) 自动抓取更新
    - cron: "25 22 * * *"
    # 每天北京时间傍晚 18:25 (UTC 10:25) 再次自动复查与更新
    - cron: "25 10 * * *"
  workflow_dispatch: # 随时支持在 GitHub 网页上点击一键立即手动运行

permissions:
  contents: write

jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 创建并激活 venv 虚拟环境执行抓取与汉化
        env:
          # 用户指定大模型翻译 API 端点与密钥配置 (优先使用仓库 Secret，未配置则使用内置指定地址)
          TRANSLATE_API_URL: ${{ secrets.TRANSLATE_API_URL || 'https://cli.136222.xyz/v1' }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY || 'sk-f6ba10cfedb11ef9213fe3f0eae6fc81727b08d12bd4cc211ab015a978cb1f0f' }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL || 'gemini-2.5-flash' }}
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 scripts/update_trending.py

      - name: 提交并推送到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html _next/static/chunks/app/page-*.js scripts/ .github/
          if git diff --cached --quiet; then
            echo "✅ 榜单内容无变化，跳过自动提交"
          else
            git commit -m "AutoSync: 每日定时自动更新 Github乐园 TOP10 [$(date '+%Y-%m-%d %H:%M')]"
            git push
          fi
