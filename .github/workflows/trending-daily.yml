name: 每日更新 Github乐园 TOP10

on:
  schedule:
    # 每天 07:00 北京时间 (UTC+8) = 前一天 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 GitHub Trending 并更新版块
        env:
          # 可选：配置后启用大模型中文翻译；不配置则用内置词典+规则兜底
          TRANSLATE_API_URL: ${{ secrets.TRANSLATE_API_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
        run: python3 scripts/update_trending.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html _next/static/chunks/app/page-*.js
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 每日自动更新 Github乐园 TOP10"
            git push
          fi
